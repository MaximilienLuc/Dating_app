name: Stability analysis
on:
  push:
    branches: [remi/stability-analysis]
    paths:
      - 'src/stability.py'
      - 'tests/test_stability.py'
      - '04_stability.ipynb'
      - 'requirements-stability.txt'
      - '.github/workflows/stability.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stability:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-stability.txt
      - run: pip install -r requirements-stability.txt
      - run: python -m pytest tests/test_stability.py -q
      - run: python -m src.stability --refits 200 --eval-bootstrap 2000
      - run: jupyter nbconvert --to notebook --execute 04_stability.ipynb --output 04_stability.executed.ipynb --ExecutePreprocessor.timeout=180
      - uses: actions/upload-artifact@v4
        with:
          name: stability-results
          path: |
            reports/stability/
            04_stability.executed.ipynb
          if-no-files-found: error
