name: Stability analysis
on:
  pull_request:
    paths:
      - 'src/stability.py'
      - 'tests/test_stability.py'
      - 'requirements*.txt'
      - '04_stability.ipynb'
      - '.github/workflows/stability.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stability:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-stability.txt
      - run: pip install -r requirements-stability.txt
      - run: python -m pytest tests/test_stability.py -q
      - name: Require the reduced logit contract for publication
        if: github.event_name == 'workflow_dispatch'
        run: python -c 'import json; c=json.load(open("data/features.json")); assert "features_logit" in c, "features_logit is not published yet; do not regenerate obsolete logit results"'
      - if: github.event_name == 'workflow_dispatch'
        run: python -m src.stability --refits 200 --eval-bootstrap 2000
      - if: github.event_name == 'workflow_dispatch'
        run: jupyter nbconvert --to notebook --execute 04_stability.ipynb --output 04_stability.executed.ipynb --ExecutePreprocessor.timeout=180
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: stability-results
          path: |
            reports/stability/
            04_stability.executed.ipynb
          if-no-files-found: error
